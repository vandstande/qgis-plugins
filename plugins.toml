# =====================================================================
#  Fælles konfiguration for alle QGIS-plugins i dette repository
# =====================================================================
#  Det der står her, styres CENTRALT og skrives automatisk ind i hvert
#  plugins metadata.txt ved build (og med `python tools/build.py sync`).
#
#  Alt andet (name, version, description, about, changelog, icon, tags,
#  qgisMinimumVersion/qgisMaximumVersion, supportsQt6, experimental ...)
#  rettes direkte i det enkelte plugins metadata.txt.
# =====================================================================

[repo]
github_bruger = "vandstande"
repo_navn     = "qgis-plugins"
# Valgfrit: eget domæne til GitHub Pages, fx "plugins.vandstande.dk".
# Lad stå tom for at bruge https://<bruger>.github.io/<repo>/
eget_domaene  = ""
titel         = "Vandstande.dk – QGIS plugins"

# Felter der overskrives i ALLE plugins' metadata.txt
[faelles]
author             = "Jan Pedersen"
email              = "jan@vandstande.dk"

# Grupper = sammenhængen til hjemmesiderne.
# Hvert plugins "homepage" sættes til gruppens side.
[grupper.timflow]
navn     = "TimFlow og HEC-RAS-værktøjer"
homepage = "https://www.vandstande.dk/timflow"

[grupper.anlaeg]
navn     = "Anlægsværktøjer"
homepage = "https://www.vandstande.dk/anlaeg"

# Plugin-mappe (under plugins/)  =  gruppe
# Mappenavnet skal være det samme som pluginets Python-mappenavn.
[plugins]
TimFlow = "timflow"
indlaes_modelgrid = "timflow"
HECRAS_til_TimFlow = "timflow"
import_aem_elementer = "timflow"
GravSkrab = "anlaeg"
grav_groefter = "anlaeg"
fyld_groefter = "anlaeg"
